name: Updater

on:
  push:
    branches: [master]

jobs:
  build:
    name: Update
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push aocserver
        uses: docker/build-push-action@v3
        with:
          context: ./server/
          push: true
          tags: ghcr.io/schlauer-hax/aoc-server
          labels: |
            org.opencontainers.image.source="https://github.com/Schlauer-Hax/advent-of-code"

      - name: Build and push aocts
        uses: docker/build-push-action@v3
        with:
          context: ./clients/typescript/
          push: true
          tags: ghcr.io/schlauer-hax/aoc-ts
          labels: |
            org.opencontainers.image.source="https://github.com/Schlauer-Hax/advent-of-code"

      - name: Build and push aocjava
        uses: docker/build-push-action@v3
        with:
          context: ./clients/java/
          push: true
          tags: ghcr.io/schlauer-hax/aoc-java
          labels: |
            org.opencontainers.image.source="https://github.com/Schlauer-Hax/advent-of-code"

      - name: Deploy
        env:
          HOOK_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
        run: |
          sig=$(printf '{}' | openssl dgst -sha256 -hmac "$HOOK_SECRET" | awk '{print $NF}')
          curl -sS --fail-with-body --max-time 600 -X POST -H 'Content-Type: application/json' -H "X-Signature: sha256=$sig" -d '{}' https://haxis.me/hooks/aoc
